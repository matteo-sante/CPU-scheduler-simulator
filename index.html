<!DOCTYPE html>
<html lang="en">
<head>
   <title>CPU scheduler simulator</title>
   <meta charset="utf-8">
   <meta name="viewport" content="width=device-width, initial-scale=1">
   <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
   <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
   <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
</head>
<body>
<div class="container">
   <h2>CPU scheduler simulator</h2>
   <div>
       <div>
        <p>L'algoritmo SJF è</p>
          <button id="idStart" onclick="start()"> Start </button>
          <button id="idReset" onclick="reset()"> Reset </button>
       </div>
       <div>
           <table class="table" id="idTable">
               <thead class="table-light">
                   <tr>
                   <th>Process</th>
                       <th>Arrival Time</th>
                       <th>Burst Time</th>
                       <th>Remaining Burst Time</th>
                       <th>Priority</th>
                   </tr>
               </thead>
               <tbody>
               </tbody>
           </table>
       </div>
   </div>
<div id="output" style="display: none">
       <p>Di seguito l'evoluzione dei processi: </p>
       <div class="progress" >
           <div class="progress-bar progress-bar-success" role="progressbar" style="width:25%"> P1 </div>
           <div class="progress-bar progress-bar-warning" role="progressbar" style="width:25%"> P2 </div>
           <div class="progress-bar progress-bar-danger" role="progressbar" style="width:25%"> P3 </div>
           <div class="progress-bar progress-bar-info" role="progressbar" style="width:25%"> P4 </div>
       </div>
       <div class="progress">
  <div class="progress-bar bg-success" role="progressbar" style="width: 25%" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100"></div>
</div>
<div class="progress">
  <div class="progress-bar bg-info" role="progressbar" style="width: 50%" aria-valuenow="50" aria-valuemin="0" aria-valuemax="100"></div>
</div>
<div class="progress">
  <div class="progress-bar bg-warning" role="progressbar" style="width: 75%" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100"></div>
</div>
<div class="progress">
  <div class="progress-bar bg-danger" role="progressbar" style="width: 100%" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100"></div>
</div>
   </div>
</div>
<div id="parametri"></div>
<script src="script.js"></script>
</body>
</html>
